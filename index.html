<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
</head>
<body>
<title>Projects</title>
<style>
:root{
  --paper:#f2f0ea; --card:#ffffff;
  --ink:#1e1c22; --ink-dim:#625f68; --ink-faint:#9b98a1;
  --line:#dedad2; --card-line:#c3bcae;
  --accent:#4b3f72;
  --live:#3f7a5c; --live-bg:#e6efe8;
  --error:#a15c3e; --error-bg:#f5e9e1;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:56px 24px 96px;}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin:0 0 12px;}
h1{font-size:40px; line-height:1.1; margin:0 0 12px; font-weight:700; letter-spacing:-.01em;}
.lede{font-size:15px; color:var(--ink-dim); margin:0 0 36px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:28px;}
.tab-btn{
  appearance:none; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-faint);
  padding:10px 4px; margin-right:24px; border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--ink); border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.controls-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  appearance:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:600;
  border:1px solid var(--line); background:var(--card); color:var(--ink-dim);
  border-radius:999px; padding:6px 13px; transition:all .15s ease;
}
.chip:hover{border-color:var(--card-line); color:var(--ink);}
.chip.selected{background:var(--accent); border-color:var(--accent); color:#fff;}

.cover-toggle{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-dim); font-weight:600; white-space:nowrap;}
.switch{position:relative; width:38px; height:22px; flex:none;}
.switch input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .15s ease;}
.switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s ease;}
.switch input:checked ~ .track{background:var(--accent);}
.switch input:checked ~ .knob{transform:translateX(16px);}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:20px;}
.card{
  background:var(--card); border:1px solid var(--card-line); border-radius:14px; overflow:hidden;
  cursor:pointer; text-align:left; display:flex; flex-direction:column;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:hover{transform:translateY(-3px); box-shadow:0 0 0 1px var(--card-line), 0 10px 24px rgba(30,28,34,.1);}
.card .cover-wrap{position:relative; width:100%; aspect-ratio:2/1; background:var(--paper); overflow:hidden;}
.grid.hide-covers .card .cover-wrap{display:none;}
.card .cover-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.card .body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:9px; flex:1;}
.card-title-row{display:flex; align-items:center; gap:8px;}
.card-title{font-size:16px; font-weight:700; letter-spacing:-.01em; flex:1; min-width:0; overflow-wrap:anywhere;}
.badge{font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:999px; flex:none;}
.badge-live{background:var(--live-bg); color:var(--live);}
.card-desc{font-size:13px; color:var(--ink-dim); line-height:1.5; margin:0;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11px; font-weight:600; color:var(--ink-dim); background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:3px 7px;}
.pushed{font-size:11.5px; color:var(--ink-faint); margin-top:auto; padding-top:2px;}
.card-links{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line);}
.card-link{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 0; font-size:12.5px; font-weight:700; color:var(--ink);
  text-decoration:none; background:var(--card);
}
.card-link:first-child{border-right:1px solid var(--line);}
.card-link:hover{background:var(--paper);}
.icon{width:12px; height:12px; background-color:currentColor; flex:none;}
.icon-external{-webkit-mask:var(--icon-external) center/contain no-repeat; mask:var(--icon-external) center/contain no-repeat;}
.icon-github{-webkit-mask:var(--icon-github) center/contain no-repeat; mask:var(--icon-github) center/contain no-repeat;}
.icon-close{-webkit-mask:var(--icon-close) center/contain no-repeat; mask:var(--icon-close) center/contain no-repeat;}

:root{
  --icon-external:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>');
  --icon-github:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M12 .5C5.73.5.98 5.24.98 11.52c0 5.02 3.26 9.28 7.78 10.78.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.1-3.17.69-3.84-1.35-3.84-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.53-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17a10.9 10.9 0 0 1 5.72 0c2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.67 5.34-5.21 5.62.41.36.77 1.06.77 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.66.79.55 4.51-1.51 7.77-5.76 7.77-10.78C23.02 5.24 18.27.5 12 .5z"/></svg>');
  --icon-close:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>');
}

.overlay{position:fixed; inset:0; background:rgba(30,28,34,.5); display:none; align-items:flex-start; justify-content:center; padding:64px 20px; overflow-y:auto; z-index:50;}
.overlay.open{display:flex;}
.modal{background:var(--card); border-radius:16px; max-width:640px; width:100%; padding:32px 32px 36px; position:relative; box-shadow:0 20px 60px rgba(30,28,34,.3);}
.modal-close{position:absolute; top:20px; right:20px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.modal-close:hover{border-color:var(--card-line);}
.modal-close .icon{width:13px; height:13px;}
.modal-title-row{display:flex; align-items:center; gap:10px; margin:0 40px 10px 0;}
.modal-title{font-size:22px; font-weight:700; letter-spacing:-.01em;}
.modal-desc{font-size:14px; color:var(--ink-dim); line-height:1.6; margin:0 0 14px;}
.modal .tag-row{margin-bottom:22px;}
.modal .card-links{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:26px;}
.modal .card-link{padding:12px 0;}
.readme{border-top:1px solid var(--line); padding-top:22px; font-size:13.5px; line-height:1.7; color:var(--ink);}
.readme h1,.readme h2,.readme h3,.readme h4{font-size:15.5px; font-weight:700; margin:20px 0 8px; letter-spacing:-.005em;}
.readme h1:first-child,.readme h2:first-child,.readme h3:first-child{margin-top:0;}
.readme p{margin:0 0 12px;}
.readme ul,.readme ol{margin:0 0 12px; padding-left:20px;}
.readme li{margin:0 0 4px;}
.readme a{color:var(--accent);}
.readme code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:12px; background:var(--paper); border-radius:4px; padding:1px 5px;}
.readme pre{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:12px; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:0 0 14px;}
.readme pre code{background:none; padding:0;}
.readme blockquote{margin:0 0 14px; padding:2px 14px; border-left:3px solid var(--card-line); color:var(--ink-dim);}
.readme table{border-collapse:collapse; width:100%; margin:0 0 14px; font-size:12.5px; overflow-x:auto; display:block;}
.readme th,.readme td{border:1px solid var(--line); padding:6px 10px; text-align:left;}
.readme th{background:var(--paper); font-weight:700;}
.readme-empty{color:var(--ink-faint); font-size:13.5px;}

.stats-section{margin-bottom:44px;}
.stats-title{font-size:14px; font-weight:700; margin:0 0 18px;}
.bar-row{display:grid; grid-template-columns:140px 1fr 40px; align-items:center; gap:12px; margin-bottom:10px; font-size:12.5px;}
.bar-label{color:var(--ink-dim); font-weight:600; overflow-wrap:anywhere;}
.bar-track{background:var(--line); border-radius:6px; height:10px; overflow:hidden;}
.bar-fill{background:var(--accent); height:100%; border-radius:6px;}
.bar-count{color:var(--ink-faint); text-align:right;}
.stacked-bar{display:flex; width:100%; height:16px; border-radius:8px; overflow:hidden; background:var(--line); margin-bottom:14px;}
.stacked-seg-active{background:var(--live);}
.stacked-seg-stale{background:var(--ink-faint);}
.legend{display:flex; gap:22px; font-size:13px; color:var(--ink-dim);}
.legend-item{display:flex; align-items:center; gap:7px;}
.legend-dot{width:10px; height:10px; border-radius:50%; flex:none;}

@media (max-width:520px){
  h1{font-size:32px;}
  .wrap{padding:40px 16px 72px;}
  .modal{padding:26px 20px 30px;}
}
</style>

<div class="wrap">
  <p class="eyebrow">2026 Vibe Coding Study</p>
  <h1>Projects</h1>
  <p class="lede">카드를 클릭하면 상세 설명을 볼 수 있습니다.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="portfolio">포트폴리오</button>
    <button class="tab-btn" data-tab="stats">통계</button>
  </div>

  <div class="tab-panel active" id="panel-portfolio">
    <div class="controls-row">
      <div class="chips" id="chips"></div>
      <label class="cover-toggle">
        커버 이미지 보이기
        <span class="switch">
          <input type="checkbox" id="coverToggle">
          <span class="track"></span>
          <span class="knob"></span>
        </span>
      </label>
    </div>
    <div class="grid hide-covers" id="grid"></div>
  </div>

  <div class="tab-panel" id="panel-stats">
    <div class="stats-section">
      <p class="stats-title">기술 스택 분포</p>
      <div id="techBars"></div>
    </div>
    <div class="stats-section">
      <p class="stats-title">활동상태 비율</p>
      <div class="stacked-bar" id="statusBar"></div>
      <div class="legend" id="statusLegend"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose"><span class="icon icon-close"></span></button>
    <div class="modal-title-row">
      <span class="modal-title" id="modalTitle"></span>
      <span class="badge badge-live">LIVE</span>
    </div>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="tag-row" id="modalTags"></div>
    <div class="card-links" id="modalLinks"></div>
    <div class="readme" id="modalReadme"></div>
  </div>
</div>

합니다.\n3. 로컬 개발 시:\n   ```bash\n   npm install -g vercel\n   vercel dev\n   ```\n"}, {"title": "온끼", "desc": "음식 사진을 올리면 AI가 음식을 인식하고 영양정보를 보여주는 웹 서비스", "tags": ["Python", "JavaScript", "Vite", "React", "Vercel"], "pushed": "2026-07-29", "activity": "활발함", "live": "https://onkki.vercel.app", "github": "https://github.com/hwamokworks-ui/onkki", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMHAQL/xABQEAACAgECAwMGCgcHAgMGBwAAAQIDBAURBhIhEzFBBxVRYXGhFBciMlJUgZGx0RYzQnOSosEjNDU2U3SyN3IkwvAlY4KDk+EmQ2KEo8Px/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACYRAQABAwQDAQEAAgMAAAAAAAACAQMRBBITURRBUiExBTIjscH/2gAMAwEAAhEDEQA/APZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+Sait2B9Bwdz8EkfO2n6gJAI/bT9Q7afqAkAj9tP1Dtp+oCQCP20/UO2n6gJAI/bT9Q7afqAkAj9tP1H1XPxSYHcHyLUluj6AAAAAAAAAAAA5ZGRTi4878m2FNMFvKc5KMYr1tnUzvH/8AkbVf3P8A5kBeYuVj5mPG/Evrvplvy2VyUovbp3o7GT8mjUeAsFyaSTs3b/75GnpyaL21RdXY49/JNPb7gOoPjaXe9j6AB83W+263PoAHxNPue5+LbqqYc91kK4+mckkB0BzpuqvhzU2wsj6YSTXuOgAHxNPue5zhkUTtdULq5WLvgpptfYB1B8lJRi5SaSXVt+BzpyKL9+wurs27+SSlt9wHUA/M5wrg5WSjCK73J7ID9A5U303x3othYl4wkn+B1AiV6lg2508KrMonl1redMbE5x9q7/FEs8y0D/rVq/7uf4QPTQAPzzR9K+8+rr3AfQfG0n1aPoAHxNN9GhJqMW5NJLvbA+g41ZOPe2qb67Gu9Qmnt9x2AA+brfbfqfl21q2NTsirJdVByW7+wCPXqWDbnTwqsyieXWt50xsTnH2rv8USzzLQP+tWr/u5/hA9NAA+Jp9zTOd2RRRt291dW/dzzUfxA6g/FdldsFOqcZxfjF7o/YAAAAfE0+5pn0ARfOOD5w+AfDKPhm2/Ydoufbbf5vf3dSSmn3Pczi4WrXHL4j+GS7Rw5fg/Itvmcvfv9oGkOWRfTi0TvybYVUwW8pzkoxivW2dTFeUK2efZpfDWNJqzUb1K7b9mqPVv/wBegDY03VZFMLqLI2VTXNGcXupL0pnQ501Qoorpqio11xUYxXgl0R **배포**: Vercel\n\n## 설치 및 실행\n\n```bash\npip install -r requirements.txt\n```\n\nSupabase를 쓰려면 `supabase_schema.sql`로 테이블을 먼저 생성해야 합니다.\n\n```bash\npython app.py\n```\n\n서버는 `http://127.0.0.1:5000`에서 실행됩니다.\n\n## 프로젝트 구조\n\n- `app.py` — Flask 라우트\n- `vision.py` — 이미지 → 재료 목록 추출\n- `recipe.py` — 재료 → 레시피 생성\n- `db.py` — Supabase 연동\n- `config.py` — 환경변수 로딩\n"}, {"title": "우리 동네 카페 지도", "desc": "카카오맵 기반 동네 카페 방문 기록 서비스", "tags": ["React", "Vite", "Tailwind CSS", "Supabase"], "pushed": "2026-07-27", "activity": "활발함", "live": "https://visitiedcafemap-pwa.vercel.app", "github": "https://github.com/hwamokworks-ui/visitiedcafemap-pwa", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAQFBgMCAQcI/8QATBAAAQMDAQQGBgcFBQYFBQAAAAECAwQFEQYSEyExFUFRUmGhBxQicYGRFjIzVJKx0TVCU3PBFyM0crIkNmN04fAlN2KDlGR1gtLx/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACYRAQABAwUAAgICAwAAAAAAAAACAQMRBBIUUVITMSFBMrEFI+H/2gAMAwEAAhEDEQA/AP2YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPjlRqZUD6Dgsy9SIh83z/ACQCPvn+A3z/ACQCPvn+A3z/ACQCPvn+A3z/ACQCPvn+A3z/ACQCPvn+B9SZetEUDuD41UcmUPoAAAAAAAAAAACm1TfW6ds6176d1QiSNZsNds8+vJcmK9K/+5bv+Yj/qBson7yFkmMbTUXHvPZi+mdT1tIyfT1qpnULWIkclVIqPnwnNrcphOzPMstLaidqG0VEjYEp6+mcsUsLlyjX44eOP+oGiBndFagm1DaZpquKOGqgndFLHHnCY5cyr0vrSe9aoqbdNTxR02JHU0jc5kRrsccrjl2DA2wM3UX+p+nlNYaWKJ0Pq6zVEjs7TOeETjjs+ZXyalvd2uVXS6Xt1PJBSPWOSqq3q1rnJzRqIMDaAy2n9SV1RfJrHfqKOkuMce9YsTtpkre1P++0+ah1VJZdUUNvdTtlp6iBz/ZRVkc/ijWt6uKoifEYGqBha/U2prK6OuvVopWWt70a/cSq6SJF5ZXkvyJVTfNR3Br6nTNtpZre1VRk1RIqOnxzVqcOGe3mXA2AKH i/translate?text=Hello`로 번역 API가 제공됩니다.\n"}, {"title": "핫한 디저트 가게 \"오늘의 주문\"", "desc": "디저트 가게 메뉴 주문/주문 현황을 연습하는 React 기초 학습용 실습 프로젝트", "tags": ["React", "Vite", "Tailwind CSS", "Supabase", "React Router"], "pushed": "2026-08-05", "activity": "활발함", "live": "https://dessert-cafe-smoky.vercel.app", "github": "https://github.com/hwamokworks-ui/dessert_cafe", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABOEAACAgECBAEJAwgGBgkFAQAAAQIDBAURBhIhMRMUFUFRUmFxgaEHIpEWMjNCVJKx0RcjNVNzwSQ0NnKy4SViY3SClKLS8DdVZHWDk//EABoBAQEAAwEBAAAAAAAAAAAAAAABAgMEBQb/xAAmEQEAAQMFAAICAwEBAAAAAAAAAgEEEQMSFFFSEyExQSMysQUi/9oADAMBAAIRAxEAPwD9mAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD5JqK3YH0HB3P0JI+eNP3ASAR/Gn7h40/cBIBH8afuHjT9wEgEfxp+4eNP3ASAR/Gn7h40/cBIBH8afuPqufpSYHcHyLUluj6AAAAAAAAAAAApuKddjw7o7z548shKyMOSMuXv6dy5MV9q/8AsXL/ALxX/mBsqp+JTCzbbmint8T2YvzzxPm4kL+HtKxpYMYJV2ZVjU79l3jHdbL1b9yy4W4ilxDpGRZGhY+fjSdVtMnuoz26e/b/AJgaIGd4K4gu4h0m67LqrpyqL5VW1177Lbt3KvhfjS/WuKMnTrseqvG2sljWR33sUZbdd3t29QwNsDN5Gv5P5eY2g4tVUqfJ3dkWS35od9kuu3q/Er7OJdb1bUsvF4X07HsoxJuuzKy5uMZSXdRSGBtAZbh/iTOyNcu0PXsKvE1GuvxYOqXNC2PrX/z1nziHiqzReKMHT5Y8bcfIolP7qbslPqoxj6OrSXzGBqgYXP4m4m0WVedrWkYsNLnNRn4FrlZUn23fZ/gSsnXOI9QjPJ4Z03Fu0+LahdkWNSv27uK6dN/X3LgbAFDwjxDHiLSpXypePk02Oq+rfflkvV7iry+KNU1HWMnTeFcCnJ8kfLflZE2q4y9S27kGyKPiHiCGiZOm0yxpXeX3qlNT5eTt19/cqtP4o1LE1yjSeKcGrFtyv9XyKJb1zfq69n/yI32jf2nwx/8AsF/GJcI3QM1xTxP5psp0/TqFm6vktKrHXZL2pbdkcOJNf1Xh7SdNy8mjFsdtyrzORS5Yb9fu9fc+5MK1gM/xjr1ug6FHMxKoX5FtsK6oS3ak38PcmdOHdeWq 처\n\n- **한국관광공사 TourAPI — KorPetTourService2**: 지역/키워드/위치 기반 관광정보 목록, 반려동물 동반 상세 규정 조회.\n- **Anthropic Claude API**: 룰 기반 파서로 명확히 판정할 수 없는 모호한 규정 문구를 해석합니다.\n- **카카오맵 JavaScript SDK**: 지도/마커 표시.\n\n## 판정 엔진 구조\n\n`/api/verdict`는 2단계 하이브리드로 동작합니다.\n\n1. **룰 기반 파서** — 체중 제한, 소형/중형/대형견 분류, 마릿수 제한 등을 정규식으로 추출해 즉시 판정합니다.\n2. **LLM 해석** — 룰로 확정할 수 없는 모호한 문구만 Claude API로 해석합니다.\n\n## 알려진 제한사항\n\n- 이 저장소에는 실제 TourAPI/Anthropic/카카오맵 키가 포함되어 있지 않습니다.\n"}, {"title": "종로구 전자도서관 소장목록 대시보드", "desc": "종로구 전자도서관 소장목록 시각화 및 타 자치구 비교 대시보드", "tags": ["Python"], "pushed": "2026-08-13", "activity": "활발함", "live": "https://jongno-elibrary-dashboard-hwamokworks-4351s-projects.vercel.app", "github": "https://github.com/hwamokworks-ui/jongno-elibrary-dashboard", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABQEAABAwMCAgUIBgYHBQYHAAABAAIDBAURBhIhMRNBUWHRBxQXIlRxgaIyM5GSobEVFiNCUlMkNDVicnPBNnSy4fAlN2OTlLNDVWR1goPC/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAEDAgQF/8QAIhEBAAEFAAIDAQEBAAAAAAAAAAMBAhETUQRBEhQxITIj/9oADAMBAAIRAxEAPwD9mREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBEXxxDRkoPqLgZj1ABfOmf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5fRMesAoO6L40hwyF9QEREBERAREQEREBU2qb63TtnNe+ndUASNZsa7bz68q5WK8q/+xbv94j/ANUGyif0kLJMY3NBx717WL/TOp62kZPp61UzqFrAI5KqQh8+Bza3IwOzPNWWltRO1DaKiRsAp6+mcYpYXHIa/HDvx/zQaJFndFagm1DaZpquKOGqgndFLHHnAxy5qr0vrSe9aoqbdNTxR02JHU0jc5kDXY45OOXYmBtkWbqL/U/r5TWGliidD5uZqiR2dzOeAOOOz7VXyalvd2u P6mz2/qSDyeYxsSuNetZ/ETP8A19/ByeXth1ma/wAh/9k=", "readme": "# 회원 출결관리 웹앱\n\nReact(Vite) + Supabase로 만든 실습용 회원 출결관리 웹앱입니다. 회원은 로그인 후 하루 한 번 출석 체크를 하고 연속 출석일수를 확인하며, 관리자는 전체 회원의 오늘자 출결 현황을 조회합니다.\n\n## 주요 기능\n\n- **로그인(`/`)** — 이메일/비밀번호 로그인, 로그인 성공 시 역할에 따라 자동 분기\n- **출석체크(`/attendance`, 회원 전용)** — 오늘 출석 여부 조회, \"출석하기\" 버튼으로 기록, 연속 출석일수 표시\n- **출결 현황(`/admin`, 관리자 전용)** — 회원 전체를 대상으로 오늘자 출석 여부·시각을 조회\n- 역할 기반 라우팅 가드\n\n### 아직 구현되지 않은 부분\n\n- PRD에 정의된 QR 출석 처리 경로(`/checkin`)는 아직 등록되어 있지 않습니다.\n- PRD의 이메일 알림 기능은 이 프런트엔드 저장소 범위 밖입니다.\n\n## 기술 스택\n\n- React 19 + Vite, react-router-dom\n- Supabase(`@supabase/supabase-js`) — Auth, Postgres\n- Oxlint\n\n## 시작하기\n\n```bash\nnpm install\ncp .env.example .env\nnpm run dev\n```\n"}, {"title": "오늘의 건강", "desc": "식단·수분·걸음·수면·생리 주기를 기록하는 셀프 웰니스 트래커", "tags": ["React", "TypeScript", "Vite", "Gemini API"], "pushed": "2026-07-02", "activity": "활발함", "live": "https://selfcare-v3.vercel.app", "github": "https://github.com/hwamokworks-ui/selfcare", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAQII/8QAUhAAAgIBAgMDCQMIBwUFBgcAAAECAwQFEQYSIRMxQQcUFiJRVGGi0XGBsRUyM0JzkZKhIzU2UlOywSQ0N3J0F5PC4fAlJmJjg7NDVXWCw9Lx/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAJBEBAAEDBAIDAQEBAAAAAAAAAAMBAhETFFFSBEESITEyI2H/2gAMAwEAAhEDEQA/AOzAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB5JqK3YHoMDufgkjztp/ADYBr9tP4Dtp/ADYBr9tP4Dtp/ADYBr9tP4Dtp/ADYBr9tP4Dtp/ADYBr9tP4HqufikwM4PItSW6PQAAAAAAAAAAAGLIyKcXHnfk2wppgt5TnJRjFfFsyld4/8A7Dar+x/8SAnMXKx8zHjfiX130y35bK5KUXt070Zip+T er-motion 계열), lucide-react\n- **차트**: recharts\n- **데이터 저장**: 브라우저 localStorage (서버/DB 미사용)\n\n## 설치 및 실행\n\n```bash\nnpm install\nnpm run dev\nnpm run build\nnpm run preview\nnpm run lint\n```\n"}, {"title": "오늘의 건강", "desc": "식단·수면·걸음·체중 등을 기록하고 추세를 분석하는 셀프 웰니스 트래커", "tags": ["React", "TypeScript", "Vite", "Gemini API", "Supabase"], "pushed": "2026-07-16", "activity": "활발함", "live": "https://selfcare-v4.vercel.app", "github": "https://github.com/hwamokworks-ui/selfcare_v4", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABQEAABAwMBBAYGBwQHBQUJAAAAAQIDBAUREgYTITEWQVFUYdEHFCJxgaIVMjORkqGxIzVSUyQ0QnJzweE2YnSCsiVjk9LwN1VWZHWDlMLx/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAEDAgQF/8QAIxEBAAIBBQEAAwEBAQAAAAAAAAEDAhETFFFSBBIxQSEyI//aAAwDAQACEQMRAD8A/ZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+OVGplQPoOCzL1IiHzfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4H1Jl60RQO4PjVRyZQ+gAAAAAAAAAAAKbam+t2ds6176d1QiSNZoa7Tz68lyYr0r/7Fu/4iP/MDZRP3kLJMY1NRce89mL+mdp62kZPs9aqZ1C1iJHJVSKj58Jza3KYTszzLLZbaJ20NoqJGwJT19M5YpYXLlGvxw8cf6gaIGd2K2gm2htM01XFHDVQTuiljjzhMcuZV7L7aT3raipt01PFHTYkdTSNzmRGuxxyuOXYNBtgZuov9T08prDSxROh9XWaokdnUznhE447PvK+TaW93a5VdLsvbqeSCkesclVVvVrXOTmjUQaDaAy2z+0ldUXyax36ijpLjHHvWLE7UyVvan/rtPm0O1Ull2oobe6nbLT1EDn+yirI5/FGtb1cVRE+I0GqBha/abaayujrr1aKVlre9Gv3EqukiReWV5L9xKqb5tHcGvqdmbbSzW9qqjJqiRUdPjmrU4cM9vMug2AKHZHaFu0VqdO6FaephkWKeLOdLk7PAq6vai6XG8VNt2VoIan1RdM9VUPVI2u7ExzINkUe0O0DLJU22F1M6b1+dIUVH6dHLj48yqt+1FypL5BadqaGKllqv6vUQOzG9ezjyX/Qjekb957Mf/UE/VpdEboGa2 7HABAAEEAFEBABEUABAAQBAQEUABARFAAEVEEJVEVEVJQdttvcWpba1KMzTL3Zme65aq76LseyqP18YZ+2dvnSt02IotVxjZ8R6+Lcnv+NM/ehrU5W7lyzdpu2q6rdyieaa6J4mmfbEueWMrUum3owdtTq1nYMUY24LVWdYjujIo4i7T8fKr6T8WWtC3Lo+v2e3pWdavTx32+ezXT8aZ73K42Ny7du1b3rHG+Nb/827/NLaRq1vWumve2tVUVRVTOZc4mJ7p9Zrj7TJ0gDqygqIO12n/9w0b/AM21/PDaxqntOum3u/R67lUU0U5tqZmfCPXhtY5ZtQHU65uPR9Asek1XOtWJ45ptzPNdXwpjvliPdnV3Nzaa8XbtqrCsT3TkXOJu1R7o8KfrPwZkta2yRvLfOlbVsTRerjIz6o5t4tufW+NU/dhr7ubcmpbm1OczU73a47rVqnuotR7KY/Xxl1V27cv3q7t65VcuVzzVXXPM1T7ZlwdJjpm0UGkFRQAFQAAAAAAAAAAAAAAAAAAAAAAAAAB2ID2OAgAIqIoCIAAqAICAAiogAgACKIACAigIgAAIqIqCogiOSIqOVu5XZu03LVdVu5TPNNVFUxMfCYcQHpKd+bqpwpxY1rIm3McczxNfH+Ljn6vNzMzMzM8zPjMgmlQABFRA8J5h6Sd+7q/YIw41q/FqI7MTHHb4/wAXHP1ebRLByvXbl+7Vdv3K7lyqeaq66pqmfjMuCoKAAKAACoAAAAAAAAAAAAAAAAAAAAAAAAAAAA7EEexwAEEAFEBARURQEAABAEBARQEAARUABAEAABARRFRARUARURQAEARRFQBFRAAQAAAFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHYoD1uAgCgIgACiAgIACKiACAAIogAICKIqIAACKiKAgACAioACIoACAIogICAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADsAR63AAFQBARURQEAAQQABARQAEBEUABAEAAEARRAABEAERQABARRFQBFRAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB2CA9biAiAAKgCAgAIqIAIAAiiKgCAiiKiAAAioigIAAgIACAiiKgACKgAIAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/9k=", "readme": "# 감정 키워드 검색 트렌드 대시보드\n\n네이버 데이터랩(DataLab) 검색어 트렌드 데이터를 바탕으로, '감정' 관련 키워드군의 검색 관심도 추이를 기기·성별·연령별로 살펴보는 인터랙티브 대시보드입니다.\n\n## 데이터 구성\n\n- **기간**: 2023-08-16 ~ 2026-08-16 (일간)\n- **구간**: 기기(모바일/PC) × 성별(남/여) × 연령대(11구간) = 총 44개 엑셀 파일\n- **키워드**: 감정기록, 감정분석, 감정표현, 감정어휘, 감정탐색 5개 주제어\n\n## 대시보드 기능 (`index.html`)\n\n- 기기 / 성별 / 기간 단위(일간·주간·월간) / 연령대 / 키워드 필터\n- 키워드별 검색 트렌드 라인 차트 (크로스헤어 툴팁)\n- 연령대 × 키워드 관심도 히트맵\n- 연령대별 성별·기기 비교 막대 차트\n- 필터에 반영된 원시 값을 확인할 수 있는 데이터 테이블\n- 다크/라이트 모드 토글\n\n## 실행 방법\n\n44개 엑셀 파일의 데이터가 `index.html` 안에 JSON으로 이미 인라인 포함되어 있어, 별도 서버·빌드·의존성 설치 없이 파일을 열기만 하면 바로 확인할 수 있습니다.\n\n```bash\nstart index.html\n```\n"}]</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('build-log-data').textContent);

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function inlineMd(s){
    s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, function(m,alt){ return '['+ '이미지: ' + alt + ']'; });
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m,text,url){ return '<a href="'+url+'" target="_blank" rel="noopener">'+text+'</a>'; });
    s = s.replace(/`([^`]+)`/g, function(m,c){ return '<code>'+c+'</code>'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    return s;
  }

  function mdToHtml(src){
    if(!src) return '';
    var lines = src.replace(/\r\n/g,'\n').split('\n');
    var out = [];
    var i = 0;
    var para = [];
    function flushPara(){
      if(para.length){
        out.push('<p>'+inlineMd(escapeHtml(para.join(' ')))+'</p>');
        para = [];
      }
    }
    while(i < lines.length){
      var line = lines[i];

      if(/^```/.test(line)){
        flushPara();
        i++;
        var code = [];
        while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>');
        continue;
      }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if(h){
        flushPara();
        var lvl = h[1].length;
        out.push('<h'+lvl+'>'+inlineMd(escapeHtml(h[2]))+'</h'+lvl+'>');
        i++; continue;
      }

      if(/^>\s?/.test(line)){
        flushPara();
        var quote = [];
        while(i < lines.length && /^>\s?/.test(lines[i])){ quote.push(lines[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote>'+inlineMd(escapeHtml(quote.join(' ')))+'</blockquote>');
        continue;
      }

      if(/^\s*\|.*\|\s*$/.test(line) && lines[i+1] && /^\s*\|?\s*[-:]+[-| :]*\|?\s*$/.test(lines[i+1])){
        flushPara();
        var header = line.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
        i += 2;
        var rows = [];
        while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}));
          i++;
        }
        var t = '<table><thead><tr>' + header.map(function(c){return '<th>'+inlineMd(escapeHtml(c))+'</th>';}).join('') + '</tr></thead><tbody>';
        rows.forEach(function(r){ t += '<tr>' + r.map(function(c){return '<td>'+inlineMd(escapeHtml(c))+'</td>';}).join('') + '</tr>'; });
        t += '</tbody></table>';
        out.push(t);
        continue;
      }

      if(/^\s*([-*]|\d+\.)\s+/.test(line)){
        flushPara();
        var ordered = /^\s*\d+\./.test(line);
        var items = [];
        while(i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])){
          items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,''));
          i++;
        }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<'+tag+'>' + items.map(function(it){return '<li>'+inlineMd(escapeHtml(it))+'</li>';}).join('') + '</'+tag+'>');
        continue;
      }

      if(line.trim() === ''){
        flushPara();
        i++; continue;
      }

      para.push(line.trim());
      i++;
    }
    flushPara();
    return out.join('\n');
  }

  var grid = document.getElementById('grid');
  DATA.forEach(function(item, idx){
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="cover-wrap"><img class="cover" src="'+item.cover+'" alt=""></div>'+
      '<div class="body">'+
        '<div class="card-title-row"><span class="card-title">'+escapeHtml(item.title)+'</span><span class="badge badge-live">LIVE</span></div>'+
        (item.desc ? '<p class="card-desc">'+escapeHtml(item.desc)+'</p>' : '')+
        '<div class="tag-row">'+item.tags.map(function(t){return '<span class="tag">'+escapeHtml(t)+'</span>';}).join('')+'</div>'+
        '<p class="pushed">pushed '+item.pushed+'</p>'+
      '</div>'+
      '<div class="card-links">'+
        '<a class="card-link" href="'+item.live+'" target="_blank" rel="noopener"><span class="icon icon-external"></span>Live</a>'+
        '<a class="card-link" href="'+item.github+'" target="_blank" rel="noopener"><span class="icon icon-github"></span>GitHub</a>'+
      '</div>';
    card.addEventListener('click', function(e){
      if(e.target.closest('a')) return;
      openModal(idx);
    });
    grid.appendChild(card);
  });

  var tagCounts = {};
  var tagOrder = [];
  DATA.forEach(function(item){
    item.tags.forEach(function(t){
      if(!(t in tagCounts)){ tagCounts[t] = 0; tagOrder.push(t); }
      tagCounts[t]++;
    });
  });
  var sortedTags = tagOrder.slice().sort(function(a,b){ return tagCounts[b]-tagCounts[a]; });

  var activeFilters = new Set();
  var chipsWrap = document.getElementById('chips');
  function renderChips(){
    chipsWrap.innerHTML = '';
    var allChip = document.createElement('button');
    allChip.className = 'chip' + (activeFilters.size === 0 ? ' selected' : '');
    allChip.textContent = '전체';
    allChip.addEventListener('click', function(){ activeFilters.clear(); renderChips(); applyFilter(); });
    chipsWrap.appendChild(allChip);
    sortedTags.forEach(function(t){
      var chip = document.createElement('button');
      chip.className = 'chip' + (activeFilters.has(t) ? ' selected' : '');
      chip.textContent = t + ' ' + tagCounts[t];
      chip.addEventListener('click', function(){
        if(activeFilters.has(t)) activeFilters.delete(t); else activeFilters.add(t);
        renderChips(); applyFilter();
      });
      chipsWrap.appendChild(chip);
    });
  }
  function applyFilter(){
    var cards = grid.children;
    for(var i=0;i<cards.length;i++){
      var item = DATA[i];
      var visible = activeFilters.size === 0 || item.tags.some(function(t){ return activeFilters.has(t); });
      cards[i].style.display = visible ? '' : 'none';
    }
  }
  renderChips();

  document.getElementById('coverToggle').addEventListener('change', function(e){
    grid.classList.toggle('hide-covers', !e.target.checked);
  });

  var overlay = document.getElementById('overlay');
  function openModal(idx){
    var item = DATA[idx];
    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalDesc').textContent = item.desc || '';
    document.getElementById('modalDesc').style.display = item.desc ? '' : 'none';
    document.getElementById('modalTags').innerHTML = item.tags.map(function(t){return '<span class="tag">'+escapeHtml(t)+'</span>';}).join('');
    document.getElementById('modalLinks').innerHTML =
      '<a class="card-link" href="'+item.live+'" target="_blank" rel="noopener"><span class="icon icon-external"></span>Live</a>'+
      '<a class="card-link" href="'+item.github+'" target="_blank" rel="noopener"><span class="icon icon-github"></span>GitHub</a>';
    var readmeEl = document.getElementById('modalReadme');
    if(item.readme){
      readmeEl.innerHTML = mdToHtml(item.readme);
    } else {
      readmeEl.innerHTML = '<p class="readme-empty">이 저장소에는 README.md가 없습니다.</p>';
    }
    overlay.classList.add('open');
  }
  document.getElementById('modalClose').addEventListener('click', function(){ overlay.classList.remove('open'); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') overlay.classList.remove('open'); });

  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  var maxCount = Math.max.apply(null, sortedTags.map(function(t){return tagCounts[t];}));
  var techBars = document.getElementById('techBars');
  sortedTags.forEach(function(t){
    var row = document.createElement('div');
    row.className = 'bar-row';
    var pct = Math.round(tagCounts[t] / maxCount * 100);
    row.innerHTML =
      '<span class="bar-label">'+escapeHtml(t)+'</span>'+
      '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%"></span></span>'+
      '<span class="bar-count">'+tagCounts[t]+'</span>';
    techBars.appendChild(row);
  });

  var activeCount = DATA.filter(function(d){ return d.activity === '활발함'; }).length;
  var staleCount = DATA.length - activeCount;
  var total = DATA.length || 1;
  var statusBar = document.getElementById('statusBar');
  statusBar.innerHTML =
    '<div class="stacked-seg-active" style="width:'+(activeCount/total*100)+'%"></div>'+
    '<div class="stacked-seg-stale" style="width:'+(staleCount/total*100)+'%"></div>';
  document.getElementById('statusLegend').innerHTML =
    '<span class="legend-item"><span class="legend-dot" style="background:var(--live)"></span>활발함 '+activeCount+'</span>'+
    '<span class="legend-item"><span class="legend-dot" style="background:var(--ink-faint)"></span>방치됨 '+staleCount+'</span>';
})();
</script>

</body>
</html>
