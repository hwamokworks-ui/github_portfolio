<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
</head>
<body>
<title>Build Log</title>
<style>
:root{
  --paper:#f2f0ea; --card:#ffffff;
  --ink:#1e1c22; --ink-dim:#625f68; --ink-faint:#9b98a1;
  --line:#dedad2; --card-line:#c3bcae;
  --accent:#4b3f72;
  --live:#3f7a5c; --live-bg:#e6efe8;
  --error:#a15c3e; --error-bg:#f5e9e1;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:56px 24px 96px;}
.eyebrow{font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; margin:0 0 14px;}
h1.title{font-size:42px; line-height:1.1; margin:0 0 14px; font-weight:700; letter-spacing:-0.01em;}
.lede{font-size:15.5px; color:var(--ink-dim); margin:0 0 40px;}

.tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:32px;}
.tab-btn{
  appearance:none; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink-faint);
  padding:10px 4px 12px; margin-right:22px; position:relative;
}
.tab-btn.active{color:var(--ink);}
.tab-btn.active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent); border-radius:2px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.controls-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:24px;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  appearance:none; cursor:pointer; font-family:inherit;
  border:1px solid var(--line); background:var(--card); color:var(--ink-dim);
  border-radius:100px; padding:6px 13px; font-size:13px; font-weight:500;
  transition:all .15s ease;
}
.chip .n{color:var(--ink-faint); margin-left:5px; font-size:12px;}
.chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
.chip.active .n{color:#cfcbd6;}
.chip:hover{border-color:var(--card-line);}

.toggle-row{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-dim); font-weight:500; white-space:nowrap;}
.switch{position:relative; width:38px; height:22px; flex:none;}
.switch input{opacity:0; width:100%; height:100%; margin:0; cursor:pointer; position:absolute; z-index:2;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:100px; transition:background .15s ease;}
.switch .thumb{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s ease;}
.switch input:checked ~ .track{background:var(--accent);}
.switch input:checked ~ .thumb{transform:translateX(16px);}

.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(272px,1fr)); gap:20px; margin-bottom:48px;}
.card{
  background:var(--card); border:1px solid var(--card-line); border-radius:14px; overflow:hidden;
  cursor:pointer; transition:transform .16s ease, box-shadow .16s ease;
  display:flex; flex-direction:column;
}
.card:hover{transform:translateY(-3px); box-shadow:0 0 0 1px var(--card-line), 0 14px 28px -14px rgba(30,28,34,.35);}
.card .cover-wrap{width:100%; aspect-ratio:2/1; background:var(--paper); display:none; overflow:hidden;}
.cover-on .card .cover-wrap{display:block;}
.card .cover-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.card .body{padding:16px 18px 14px; flex:1; display:flex; flex-direction:column; gap:10px;}
.card .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.card .name{font-size:15px; font-weight:700; letter-spacing:-0.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.badge{font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:100px; flex:none;}
.badge.live{background:var(--live-bg); color:var(--live);}
.card .desc{font-size:13px; color:var(--ink-dim); line-height:1.5; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11px; font-weight:600; color:var(--ink-dim); background:var(--paper); border:1px solid var(--line); padding:3px 8px; border-radius:100px;}
.pushed{font-size:11.5px; color:var(--ink-faint); margin-top:auto;}
.card .foot{display:flex; border-top:1px solid var(--line);}
.card .foot a{
  flex:1; text-align:center; padding:11px 8px; font-size:12.5px; font-weight:600; color:var(--ink-dim);
  text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px;
  transition:background .12s ease, color .12s ease;
}
.card .foot a:hover{background:var(--paper); color:var(--ink);}
.card .foot a + a{border-left:1px solid var(--line);}
.icon-ext, .icon-close{display:inline-block; width:10px; height:10px; background:currentColor;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-size:contain; mask-size:contain;
  -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M7 17L17 7M9 7h8v8'/></svg>");
  mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M7 17L17 7M9 7h8v8'/></svg>");
}
.icon-close{width:13px; height:13px;
  -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 6l12 12M18 6L6 18'/></svg>");
  mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 6l12 12M18 6L6 18'/></svg>");
}

.stat-block{margin-bottom:44px;}
.stat-block h2{font-size:15px; font-weight:700; margin:0 0 4px;}
.stat-block .sub{font-size:12.5px; color:var(--ink-faint); margin:0 0 20px;}
.bar-row{display:grid; grid-template-columns:150px 1fr 34px; align-items:center; gap:12px; margin-bottom:9px;}
.bar-row .label{font-size:12.5px; font-weight:600; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{background:var(--line); border-radius:6px; height:11px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:6px;}
.bar-row .count{font-size:12px; color:var(--ink-faint); text-align:right;}

.stacked-bar{height:22px; border-radius:8px; overflow:hidden; display:flex; border:1px solid var(--line); margin-bottom:14px;}
.stacked-bar .seg-active{background:var(--live);}
.stacked-bar .seg-dormant{background:var(--ink-faint);}
.legend{display:flex; gap:22px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim); font-weight:500;}
.legend-dot{width:10px; height:10px; border-radius:3px; flex:none;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(30,28,34,.55); display:none;
  align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:50;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--card); border-radius:16px; max-width:680px; width:100%;
  overflow:hidden; position:relative;
}
.modal-close{
  position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,.9); border:1px solid var(--line); cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--ink); z-index:2;
}
.modal .cover-wrap{width:100%; aspect-ratio:2/1; overflow:hidden; background:var(--paper);}
.modal .cover-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.modal .modal-body{padding:26px 28px 30px;}
.modal .head-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.modal .name{font-size:20px; font-weight:700; letter-spacing:-0.01em;}
.modal .desc{font-size:14px; color:var(--ink-dim); line-height:1.6; margin:0 0 14px;}
.modal .tag-row{margin-bottom:18px;}
.modal .link-row{display:flex; gap:10px; margin-bottom:24px;}
.modal .link-row a{
  font-size:13px; font-weight:600; text-decoration:none; border-radius:100px; padding:8px 16px;
  display:flex; align-items:center; gap:6px;
}
.modal .link-row a.primary{background:var(--ink); color:#fff;}
.modal .link-row a.secondary{border:1px solid var(--line); color:var(--ink-dim);}
.readme{border-top:1px solid var(--line); padding-top:20px; font-size:13.5px; line-height:1.7; color:var(--ink);}
.readme h1,.readme h2,.readme h3,.readme h4{font-weight:700; line-height:1.4; margin:20px 0 8px;}
.readme h1{font-size:16.5px;} .readme h2{font-size:15.5px;} .readme h3{font-size:14.5px;} .readme h4{font-size:13.5px;}
.readme h1:first-child, .readme h2:first-child{margin-top:0;}
.readme p{margin:0 0 12px;}
.readme a{color:var(--accent);}
.readme strong{font-weight:700;}
.readme ul,.readme ol{margin:0 0 12px; padding-left:20px;}
.readme li{margin-bottom:4px;}
.readme code{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size:12px; background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:1px 5px;}
.readme pre{background:var(--ink); color:#f2f0ea; border-radius:10px; padding:14px 16px; overflow-x:auto; margin:0 0 14px;}
.readme pre code{background:none; border:none; padding:0; color:inherit; font-size:12px;}
.readme table{border-collapse:collapse; width:100%; margin:0 0 14px; font-size:12.5px;}
.readme th,.readme td{border:1px solid var(--line); padding:6px 10px; text-align:left;}
.readme th{background:var(--paper); font-weight:700;}
.readme-empty{color:var(--ink-faint); font-style:normal;}

@media (max-width:640px){
  h1.title{font-size:32px;}
  .wrap{padding:36px 16px 64px;}
  .bar-row{grid-template-columns:100px 1fr 30px;}
}
</style>

<div class="wrap">
  <p class="eyebrow">2026 Vibe Coding Study</p>
  <h1 class="title">Projects</h1>
  <p class="lede">카드를 클릭하면 상세 설명을 볼 수 있습니다.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="portfolio">포트폴리오</button>
    <button class="tab-btn" data-tab="stats">통계</button>
  </div>

  <div class="tab-panel active" id="panel-portfolio">
    <div class="controls-row">
      <div class="chip-row" id="chip-row"></div>
      <label class="toggle-row">
        커버 이미지 보이기
        <span class="switch">
          <input type="checkbox" id="cover-toggle">
          <span class="track"></span>
          <span class="thumb"></span>
        </span>
      </label>
    </div>
    <div class="grid" id="card-grid"></div>
  </div>

  <div class="tab-panel" id="panel-stats">
    <div class="stat-block">
      <h2>기술 스택 분포</h2>
      <div id="tag-bars"></div>
    </div>
    <div class="stat-block">
      <h2>활동상태 비율</h2>
      <p class="sub">마지막 푸시일 기준 6개월 이내 = 활발함</p>
      <div class="stacked-bar" id="activity-bar"></div>
      <div class="legend" id="activity-legend"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="닫기"><span class="icon-close"></span></button>
    <div id="modal-content"></div>
  </div>
</div>

<script type="application/json" id="repo-data">{"repos": [{"name": "book-movie-tracker", "desc": "책·영화 감상 기록을 남기고 갤러리로 조회하는 개인용 웹앱", "tags": ["React", "Vite", "Tailwind CSS", "Google Sheets API", "Notion API", "Vercel"], "pushed": "2026-07-31", "live": "https://book-movie-tracker.vercel.app", "github": "https://github.com/hwamokworks-ui/book-movie-tracker", "readme": "# 독서/영화 기록 트래커\n\n책과 영화를 다 본 뒤 제목·평점·한줄평·완료일을 기록하고, 카드형 갤러리에서 한눈에 조회하는 개인용 웹앱입니다. 별도 DB 없이 **Notion** 또는 **Google Sheets**를 데이터 저장소로 사용합니다.\n\n자세한 기획 배경과 요구사항은 [`PRD.md`](./PRD.md), 구현 진행 상황은 [`IMPLEMENTATION_PLAN.md`](./IMPLEMENTATION_PLAN.md)를 참고하세요.\n\n## 주요 기능\n\n- 갤러리 조회 — 완료일 최신순 기본 정렬, 카드형 UI\n- 새 기록 추가 / 평점·한줄평 수정 / 삭제(확인 창 + undo 토스트)\n- Notion ↔ Google Sheets 데이터 소스 토글\n- 유형별 필터(책/영화), 정렬(완료일순/평점순), 제목 검색\n- 커버이미지(URL) 표시, 로딩 스켈레톤, 빈 상태·에러 안내\n\n## 기술 스택\n\n- React + Vite, Tailwind CSS, lucide-react\n- 상태 관리: React `useState`/`useContext`\n- 데이터 저장소: Notion API, Google Sheets API\n- 배포: Vercel (Serverless Functions로 API 라우트 구성)\n\n## 폴더 구조\n\n```\napi/                 서버 쪽 API 라우트 (Vercel Serverless Functions)\n  _lib/               Notion/Sheets 클라이언트 공통 로직\n  notion/records[.js] Notion CRUD 엔드포인트\n  sheets/records[.js] Sheets CRUD 엔드포인트\nsrc/\n  components/         갤러리, 카드, 모달 등 UI 컴포넌트\n  context/            AppContext (전역 상태)\n  App.jsx, main.jsx\nscripts/              개발용 점검 스크립트 (예: check-notion.mjs)\npublic/               정적 파일\nPRD.md                제품 요구사항 문서\nIMPLEMENTATION_PLAN.md 구현 계획 문서\n```\n\n## 시작하기\n\n### 1. 의존성 설치\n\n```bash\nnpm install\n```\n\n### 2. 환경변수 설정\n\n`.env.example`을 복사해 `.env`를 만들고 값을 채웁니다.\n\n```bash\ncp .env.example .env\n```\n\n| 변수 | 설명 |\n|---|---|\n| `NOTION_API_TOKEN` | Notion 연동 토큰 |\n| `NOTION_DATABASE_ID` | 기록을 저장할 Notion 데이터베이스 ID |\n| `GOOGLE_OAUTH_CLIENT_ID` / `GOOGLE_OAUTH_CLIENT_SECRET` / `GOOGLE_OAUTH_REFRESH_TOKEN` | Google Sheets 접근용 OAuth 자격 증명 |\n| `GOOGLE_SHEET_ID` | 기록을 저장할 Google Sheets 문서 ID |\n| `GOOGLE_SHEET_TAB_NAME` | 기록을 저장할 시트(탭) 이름 |\n\n인증 정보는 절대 프론트엔드 코드에 직접 넣지 않고, `api/` 아래 서버 쪽 코드에서만 환경변수로 사용합니다.\n\n### 3. 개발 서버 실행\n\n```bash\nnpm run dev\n```\n\n### 기타 명령어\n\n```bash\nnpm run build     # 프로덕션 빌드\nnpm run preview   # 빌드 결과 미리보기\nnpm run lint       # Oxlint 검사\n```\n\n## 배포\n\nVercel과 GitHub 저장소를 연동해 push 시 자동 배포합니다. 인증 정보는 Vercel 프로젝트의 환경변수로 등록합니다.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABLEAABAwMCAgYHBAYIBQIHAAABAAIDBAUREiEGMRMVQVFhoQcUIlJxgZEyM5KxFjVCVMHRIyQ0U3JzdLI2N2KC4WPwJUNkdYOU8f/EABoBAQEBAQEBAQAAAAAAAAAAAAABAwIEBQb/xAAjEQEAAQMFAAMBAQEAAAAAAAAAAgEEEQMSFFFSEzFBITIj/9oADAMBAAIRAxEAPwD9mREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBEXxxDRkoPqLgZj2ABfOmf4IJCKP0z/BOmf4IJCKP0z/BOmf4IJCKP0z/AATpn+CCQij9M/wTpn+CCQij9M/wX0THtAKDui+NIcMhfUBERAREQEREBERAVNxTfW8O2c176d1QBI1mhrtPPtyrlYr0r/8ABbv9RH/FBson9JCyTGNTQcfFe1i+ueJ62kZPw9aqZ1C1gEclVIQ+fA5tbkYHdnmrLhbiJ3ENoqJGwCnr6Zxilhcchr8beOP/ACg0SLO8FcQTcQ2maarijhqoJ3RSxx5wMcuaq+F+NJ71xRU26anijpsSOppG5zIGuxvk45dyYG2RZuov9T+nlNYaWKJ0Pq5mqJHZ1M54A3x3fVV8nEt7u1yq6Xhe3U8kFI8xyVVW8ta5w5hoCYG0RZbh/iSuqL5NY79RR0lxjj6VhidqZK3vH/vvXziHiqSy8UUNvdTtlp6iBz/ZBMjn7hrW9m5AHzTA1SLC1/E3E1ldHXXq0UrLW94a/oJS6SIHlk8j9FKqb5xHcGvqeGbbSzW9pIZNUSEOnxzLRttnv5q4GwRUPCPELeIrU6d0Jp6mGQxTxZzpcO7wVXV8UXS43iptvCtBDU+qHTPVVDyI2u7hjmoNkqPiHiBlkqbbC6mdN6/OIQQ/To5b+PNVVv4ouVJfILTxTQxUstV/Z6iB2Y3nu35H/wAKN6Rv1nwx/wDcB+bVcI3SLNcU8T9UyQ2+3QCtu9SQIqccgPedjkFw4kv914etNtq6mClkMswjrNAdpZnf2d/A81MK1iLP8Y36Ww2 Gemini Vision 연동)\n- flask-cors, python-dotenv, requests\n\n**배포**\n- Vercel (프론트엔드/백엔드를 각각 별도 서비스로 배포, `vercel.json`에서 `/api/*`는 백엔드로 라우팅)\n\n## 프로젝트 구조\n\n```\nonkki/\n├── frontend/   # React + Vite 앱\n├── backend/    # Flask API 서버 (services/vision.py, services/nutrition.py)\n├── PRD.md      # API 계약 및 상세 스펙\n└── vercel.json # 배포 설정\n```\n\n## 설치 및 실행\n\n### 백엔드\n\n```bash\ncd backend\npip install -r requirements.txt\ncp .env.example .env   # GEMINI_API_KEY, FOODSAFETY_API_KEY 등 입력\npython app.py          # http://localhost:5000\n```\n\n### 프론트엔드\n\n```bash\ncd frontend\nnpm install\nnpm run dev             # http://localhost:5160\n```\n\n## API\n\n- `GET /api/health` — 서버 및 환경변수(Gemini/식약처 키) 설정 상태 확인\n- `POST /api/analyze` — `multipart/form-data`로 이미지(`image` 필드, jpg/png/webp, 최대 10MB) 업로드 시 음식 정보와 영양정보를 반환\n\n자세한 요청/응답 스펙은 [`PRD.md`](./PRD.md)를 참고하세요.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMHAQL/xABQEAACAgECAwMGCgcHAgMGBwAAAQIDBAURBhIhEzFBBxVRYXGhFBciMlJUgZGx0RYzQnOSosEjNDU2U3SyN3IkwvAlY4KDk+EmQ2KEo8Px/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACYRAQABAwQDAQEAAgMAAAAAAAACAQMRBBITURRBUiExBTIjscH/2gAMAwEAAhEDEQA/APZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+Sait2B9Bwdz8EkfO2n6gJAI/bT9Q7afqAkAj9tP1Dtp+oCQCP20/UO2n6gJAI/bT9Q7afqAkAj9tP1H1XPxSYHcHyLUluj6AAAAAAAAAAAA5ZGRTi4878m2FNMFvKc5KMYr1tnUzvH/8AkbVf3P8A5kBeYuVj5mPG/Evrvplvy2VyUovbp3o7GT8mjUeAsFyaSTs3b/75GnpyaL21RdXY49/JNPb7gOoPjaXe9j6AB83W+263PoAHxNPue5+LbqqYc91kK4+mckkB0BzpuqvhzU2wsj6YSTXuOgAHxNPue5zhk 조회/삭제할 수 있습니다.\n\n두 개의 무료 OpenRouter LLM을 사용합니다: 이미지 인식용 `nvidia/nemotron-nano-12b-v2-vl:free`, 레시피 생성용 `openai/gpt-oss-20b:free`. 무료 모델 특성상 429 레이트리밋이나 파싱 실패(깨진 JSON 응답)가 발생할 수 있으며, 이 경우 원본 텍스트를 그대로 보여주도록 처리되어 있습니다.\n\n## 기술 스택\n\n- **백엔드**: Python, Flask\n- **DB**: Supabase (사용자/레시피 저장)\n- **이미지 처리**: Pillow\n- **외부 API**: OpenRouter (비전 모델 + 텍스트 모델), `requests`\n- **프론트엔드**: 별도 빌드 없는 순수 HTML/JS 단일 페이지 (`templates/index.html`)\n- **배포**: Vercel (`vercel.json`)\n\n## 설치 및 실행\n\n```bash\npip install -r requirements.txt\n```\n\n`.env.example`을 참고해 `.env` 파일을 만들고 아래 값을 채워주세요.\n\n```\nOPENROUTER_API_KEY=your-openrouter-api-key-here\nFLASK_SECRET_KEY=generate-with-python-secrets-token_hex-32\nVITE_SUPABASE_URL=...\nVITE_SUPABASE_ANON_KEY=...\n```\n\nSupabase를 쓰려면 `supabase_schema.sql`로 테이블을 먼저 생성해야 합니다.\n\n```bash\npython app.py\n```\n\n서버는 `http://127.0.0.1:5000`에서 실행됩니다 (`debug=True`).\n\n### 테스트\n\n자동화된 테스트 스위트는 없고, `test_api.py`가 실제 OpenRouter API를 호출해 두 모델을 점검하는 수동 스모크 테스트입니다.\n\n```bash\npython test_api.py\n```\n\n## 프로젝트 구조\n\n- `app.py` — Flask 라우트 (이미지 분석, 레시피 생성, 사용자/레시피 CRUD)\n- `vision.py` — 이미지 → 재료 목록 추출 (Step 1)\n- `recipe.py` — 재료 → 레시피 생성 (Step 2)\n- `db.py` — Supabase 연동 (사용자/레시피 저장, Step 3)\n- `config.py` — 환경변수 로딩\n- `templates/index.html` — 프론트엔드 UI\n- `PRD_step1~3.md`, `ARCHITECTURE.md`, `DESIGN.md` — 단계별 기획 및 설계 문서\n\n## 참고\n\n더 자세한 아키텍처와 개발 가이드는 `CLAUDE.md`, `ARCHITECTURE.md`를 참고하세요.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAQII/8QAThAAAQMDAQMHBwgHBgUDBQAAAQACAwQFEQYSITEHE0FRVGHRFBYicYGRohUXMjOSobGyIzU2QlJzwSQ0U3J0wjdiY+HwJSaDQ4KTw/H/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAUG/8QAJREBAAEDBQADAQADAQAAAAAAAAECAxEEExRRUhIhQTEFIzLB/9oADAMBAAIRAxEAPwDsyIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiA  색이 다르게 보이고, 카테고리별로 지도·목록을 필터링할\n  수 있으며, \"총 ○곳 중 ○곳 방문 완료\"를 지도 위에서 바로 확인한다.\n- **내 방문 목록** — 방문 체크한 카페만 모아보는 화면. 최신순/이름순\n  정렬을 지원한다.\n\n## 기술 스택\n\n- React + Vite, Tailwind CSS + shadcn/ui\n- `xlsx` (클라이언트 사이드 엑셀 파싱)\n- 카카오맵 JavaScript SDK (`libraries=services`, 주소→좌표 변환 포함)\n- Supabase (Auth + Postgres + RLS)\n\n## 시작하기\n\n### 1. 의존성 설치\n\n```bash\nnpm install\n```\n\n### 2. 환경변수 설정\n\n`.env.example`을 복사해 `.env`를 만들고 값을 채운다.\n\n```bash\ncp .env.example .env\n```\n\n| 변수 | 설명 |\n|---|---|\n| `VITE_KAKAO_MAP_KEY` | 카카오 개발자 콘솔 > 앱 키 > JavaScript 키. 콘솔에서 로컬/배포 도메인을 플랫폼으로 등록해야 지도가 뜬다. |\n| `VITE_SUPABASE_URL` | Supabase 프로젝트 URL |\n| `VITE_SUPABASE_ANON_KEY` | Supabase anon(publishable) key — service role key는 절대 넣지 않는다. |\n\n### 3. Supabase 테이블 준비\n\n`public.cafes`(공용 카페 목록)와 `public.visits`(개인 방문/소감) 테이블 및\nRLS 정책이 필요하다. 참고용 스키마는 [`supabase/schema.sql`](./supabase/schema.sql)에\n있으며, 실제 적용은 Supabase MCP(`apply_migration`) 또는 Supabase\n대시보드의 SQL Editor에서 해당 내용을 실행하면 된다.\n\n### 4. 개발 서버 실행\n\n```bash\nnpm run dev\n```\n\n## 스크립트\n\n| 명령 | 설명 |\n|---|---|\n| `npm run dev` | 개발 서버 실행 |\n| `npm run build` | 프로덕션 빌드 |\n| `npm run preview` | 빌드 결과 로컬 프리뷰 |\n| `npm run lint` | Oxlint 실행 |\n\n## 데이터 모델\n\n- `cafes` — 이름/주소로 유일하게 식별되는 공용 데이터. 누구나 조회 가능,\n  로그인 사용자만 추가/갱신 가능.\n- `visits` — 사용자별 방문 여부·소감. 본인 것만 조회/저장 가능\n  (`user_id`, `cafe_id` 조합 유니크).\n\n자세한 컬럼 정의와 RLS 정책은 `PRD.md` §6과 `supabase/schema.sql`을 참고한다.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAQFBgMBAgcI/8QATBAAAgIBAgMDCgIGBgcHBQEAAAECAwQFEQYSIRMxQQcUFSJRUmFxgaGRsRYyM1SS0SM1QlNzwRckNHJ0suE2N2Jjg5TwJWR1gtLx/8QAGgEBAQADAQEAAAAAAAAAAAAAAAECAwQFBv/EACYRAQABAwUAAgICAwAAAAAAAAACAQMRBBIUUVITMSFBMrEFI+H/2gAMAwEAAhEDEQA/AP2YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA React", "Vite", "TypeScript", "Supabase"], "pushed": "2026-08-05", "live": "https://simple-alarm-taupe.vercel.app", "github": "https://github.com/hwamokworks-ui/simple_alarm", "readme": "# 간편 알람 (Simple Alarm)\n\n브라우저에서 동작하는 알람 시계 웹앱입니다. 시각과 반복 요일을 지정해 알람을 등록하면 지정된 시각에 소리로 알려주며, 알람이 울릴 때 뉴스 브리핑과 날씨 정보를 함께 보여줍니다.\n\n## 주요 기능\n\n- **알람 관리**: 시간/반복 요일 지정 알람 추가, 켜기/끄기, 삭제 (`localStorage`에 저장되어 새로고침 후에도 유지)\n- **알람 알림**: 알람이 울리면 전체 화면 오버레이로 표시되며, 정지/스누즈 중 하나를 선택해야만 닫힘\n- **뉴스 브리핑**: 알람이 울릴 때 최신 뉴스를 음성(TTS)으로 함께 안내 (네이버 뉴스 API를 Supabase Edge Function으로 프록시하여 호출, API 키는 서버 사이드에만 보관)\n- **날씨 정보**: 화면 하단에 현재 날씨 표시\n- **다크/라이트 테마**: 기본 다크모드, 헤더 토글로 전환 가능 (설정은 `localStorage`에 저장)\n\n> 알람 소리 재생은 핵심 기능으로, 뉴스/날씨 등 부가 기능이 실패해도 알람은 항상 정상적으로 울리도록 설계되어 있습니다.\n\n## 기술 스택\n\n- **프레임워크**: React 19 + Vite 8 (TypeScript)\n- **스타일링**: Tailwind CSS v4\n- **UI 컴포넌트**: shadcn/ui (Radix UI 기반), lucide-react (아이콘)\n- **상태 관리**: React state + 커스텀 훅 (별도 전역 상태 라이브러리 없음), `localStorage` 지속성\n- **백엔드**: Supabase Edge Function (`supabase/functions/naver-news`) — 네이버 뉴스 검색 API 프록시\n- **린트**: oxlint\n\n## 시작하기\n\n```bash\nnpm install\nnpm run dev       # 개발 서버 실행 (http://localhost:8080)\nnpm run build      # 프로덕션 빌드\nnpm run preview    # 빌드 결과 미리보기\nnpm run lint       # 린트 검사\n```\n\n뉴스/날씨 API 관련 URL과 키는 `src/config/env.ts`에 기본값이 포함되어 있어 별도 `.env` 설정 없이 바로 실행됩니다. 필요 시 `VITE_SUPABASE_NEWS_FUNCTION_URL`, `VITE_SUPABASE_ANON_KEY`, `VITE_APPS_SCRIPT_URL` 환경 변수로 재정의할 수 있습니다.\n\n## 프로젝트 구조\n\n```\nsrc/\n  features/\n    alarm/    # 알람 등록/목록/알림 오버레이, 알람 로직 훅\n    news/     # 뉴스 브리핑 조회 및 TTS\n    weather/  # 날씨 조회 및 표시\n  components/ # 공용 UI (shadcn 컴포넌트, 테마 토글 등)\nsupabase/functions/naver-news/  # 네이버 뉴스 API 프록시 Edge Function\n```\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAA 해당 시점의 상세 혼잡도 확인, 혼잡 기준치 초과 시 강조 표시\n- 라이트/다크 모드 전환 (선택값은 브라우저에 저장)\n- 이메일/비밀번호 회원가입·로그인(Supabase Auth) 및 즐겨찾기(터미널+날짜+시간) 저장/조회/삭제\n\n## 기술 스택\n\n- **프론트엔드**: React 18, Vite 5\n- **차트**: Recharts\n- **인증/DB**: Supabase (Auth, Postgres + RLS)\n- **API 프록시**: Supabase Edge Function (`supabase/functions/airport-proxy`) — 공공데이터포털 \"인천공항공사 여객터미널 혼잡도 예측 정보\" API를 서버 사이드에서 호출해 CORS 이슈 없이 브라우저에 전달\n- **폰트**: Pretendard\n\n## 아키텍처 개요\n\n```\n브라우저 → Supabase Edge Function(airport-proxy) → 공공데이터포털 혼잡도 API\n브라우저 → Supabase Auth / Postgres(favorites 테이블, RLS 적용)\n```\n\n공공데이터 API 서비스키는 프론트엔드에 노출되지 않고 Supabase Edge Function Secret으로만 관리됩니다. 프론트엔드에는 Supabase `anon` public key만 노출됩니다.\n\n## 실행 방법\n\n### 1. 환경변수 설정\n\n`.env.example`을 참고해 `.env` 파일을 만들고 Supabase 프로젝트 값을 채웁니다.\n\n```\nVITE_SUPABASE_URL=\nVITE_SUPABASE_ANON_KEY=\n```\n\n### 2. 설치 및 개발 서버 실행\n\n```bash\nnpm install\nnpm run dev\n```\n\n### 3. 빌드 / 미리보기\n\n```bash\nnpm run build\nnpm run preview\n```\n\n### Supabase 설정 (최초 1회)\n\n- `supabase/migrations`의 SQL을 적용해 `favorites` 테이블 생성 및 RLS 정책 활성화\n- `supabase/functions/airport-proxy` Edge Function 배포 및 `AIRPORT_API_KEY` 시크릿 등록\n\n## 프로젝트 구조\n\n```\nsrc/\n  components/   화면 UI 컴포넌트 (헤더, 날짜/시간 선택, 혼잡도 카드, 차트, 즐겨찾기 패널 등)\n  hooks/        인증, 다크모드, 혼잡도 데이터 조회 훅\n  services/     Supabase/공공데이터 API 연동 로직\n  theme/        차트 색상 등 테마 관련 값\n  utils/        혼잡도 데이터 가공 유틸\nsupabase/\n  functions/    공공데이터 API 프록시 Edge Function\n  migrations/   favorites 테이블 및 RLS 정책 SQL\n```\n\n배포는 프론트엔드는 Vercel, API 프록시는 Supabase Edge Function을 기준으로 합니다. 상세 요구사항과 설계 배경은 `PRD.md`, `DESIGN.md`, `CLAUDE.md`를 참고하세요.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABQEAABAwMCAwMIBgUJBgMJAAABAAIDBAURBhITITFBUWEHFBUiUnGBoTJUkZKx0RYXM0LBIyQ0NTZTc 관리 — 아직 미구현 (스텁) |\n\n메뉴 데이터는 DB가 아니라 `src/data/menu.js`에 하드코딩되어 있습니다 (메뉴 관리 화면 없음).\n\n## 인증 / 세션 관리\n\n- `src/lib/supabase.js` — `VITE_SUPABASE_URL` / `VITE_SUPABASE_ANON_KEY`로 Supabase 클라이언트 생성\n- `src/context/AuthContext.jsx` — 앱 전체에 세션을 공급하는 `AuthProvider` + `useAuth()` 훅\n  - 마운트 시 `supabase.auth.getSession()`으로 초기 세션 로드\n  - `supabase.auth.onAuthStateChange()`로 로그인/로그아웃/토큰 갱신을 자동 반영\n- `AuthPage.jsx`에서 `signUp` / `signInWithPassword`로 회원가입·로그인, 성공 시 `/`로 이동, 실패 시 에러 메시지 표시\n- 비밀번호는 Supabase Auth 메서드로만 처리 — 직접 저장·비교하는 코드 없음, `service_role` key 미사용\n\n## 데이터 모델 — `orders` 테이블\n\n`supabase/sql/001_create_orders.sql`\n\n| 컬럼 | 타입 | 제약 |\n|---|---|---|\n| `id` | bigint | PK, identity |\n| `user_id` | uuid | NOT NULL, FK → `auth.users(id)` |\n| `pickup_time` | text | NOT NULL |\n| `items` | text | NOT NULL — 예: `크루아상 x2, 쑥라떼 x1` |\n| `total_price` | int8 | NOT NULL |\n| `status` | text | NOT NULL, 기본값 `'접수'`, `check (status in ('접수','완료'))` |\n| `created_at` | timestamptz | NOT NULL, 기본값 `now()` |\n\n## 권한 — Row Level Security\n\n역할은 `profiles.role` 컬럼으로 손님(기본값)/사장 둘만 존재하며, 사장 승격은 UI 경로 없이 Supabase에서 수동 SQL로만 이루어집니다. 화면에서 버튼·라우트를 숨기는 것이 아니라 **RLS 정책이 직접 강제**합니다.\n\n| 정책 | 파일 | 내용 |\n|---|---|---|\n| RLS 활성화 | `001_create_orders.sql` | `alter table orders enable row level security` |\n| `orders_insert_own` | `002_orders_insert_policy.sql` | `authenticated` 역할이 `auth.uid() = user_id`인 행만 INSERT 가능 (다른 사람 명의 주문 생성 불가) |\n| `orders_select_own` | `003_orders_select_policy.sql` | `authenticated` 역할이 `auth.uid() = user_id`인 행만 SELECT 가능 (내 주문만 조회) |\n\n아직 없음: 사장의 전체 조회(SELECT) 정책, UPDATE(완료 처리)·DELETE 정책 — `AdminPage.jsx` 구현과 함께 추가 예정.\n\n## 디자인\n\n- `src/index.css`에서 shadcn 테마 변수(`--primary`, `--background` 등)로 색상을 관리 — 현재 블루 톤\n- 간격은 8px 배수 체계(`gap-2`, `gap-4`, `gap-6`, `gap-8` 등)로 통일, 반응형 브레이크포인트(`sm:`, `lg:`)로 좌우 패딩 단계적 확장\n- `--radius: 0.35rem`으로 각진 모서리\n\n## 만들지 않는 것 (범위 제외)\n\n- 결제 기능, 소셜 로그인, 비밀번호 찾기/변경\n- 메뉴 관리 화면, 재고/품절 관리\n", "cover": "data:image/jpeg;base64,/9 1nUouNP9lsr/eh/wASOm0utadxCMpZpWtP9NkelP8A0mar+xYf4T/mP6TNV/YsP8J/zMOD7n4NLpNkem4/pM1X9iw/wn/Mf0mar+xYf4T/AJmHA+DS6Nkem4/pM1X9iw/wn/Mf0mar+xYf4T/mYcD4NLo2R6bj+kzVf2LD/Cf8zrX9pGqSju8PE/CX8zBHen9H8zCehp0p+HNdf+NPMW4/pG1P9jxPwl/M7Y/2galapb4mKtvUpfzMKS8L82fxR597GmnoVlH6r9f6n/M/muown90+/wDKv//Z"}, {"name": "mungnyang-road", "desc": "반려동물 동반여행 가능 여부와 준비물을 안내하는 웹앱", "tags": ["Next.js", "TypeScript", "Claude API", "Kakao Maps API", "TourAPI", "Python", "Streamlit"], "pushed": "2026-08-14", "live": "https://mungnyang-road.vercel.app", "github": "https://github.com/hwamokworks-ui/mungnyang-road", "readme": "# 멍냥로드 — 반려동물 동반 여행 가이드\n\n한국관광공사 반려동물 동반여행 데이터를 기반으로, 등록한 반려동물 프로필에 맞춰\n장소별 동반 가능 여부를 🟢가능 / 🟡조건부 가능 / 🔴불가 / ⚪확인불가 4단계로 안내하고,\n필수 준비물 체크리스트를 자동으로 만들어주는 웹앱입니다.\n\n## 실행 방법\n\n```bash\nnpm install\ncp .env.local.example .env.local   # 아래 환경변수를 채워주세요\nnpm run dev                        # http://localhost:3000\n```\n\n빌드/린트:\n\n```bash\nnpm run build\nnpm run lint\n```\n\n## 환경변수\n\n`.env.local`에 아래 값을 설정해야 합니다.\n\n| 변수명 | 설명 |\n| --- | --- |\n| `TOURAPI_SERVICE_KEY` | 공공데이터포털에서 발급받은 `KorPetTourService2` 인증키 (Encoding 키를 그대로 사용, 서버에서만 사용됨) |\n| `ANTHROPIC_API_KEY` | Claude API 키 (규정 해석 엔진, 서버에서만 사용됨) |\n| `NEXT_PUBLIC_KAKAO_MAP_KEY` | 카카오맵 JavaScript SDK 앱 키 (클라이언트에 노출됨) |\n| `ANTHROPIC_MODEL` (선택) | 사용할 Claude 모델 ID. 기본값 `claude-sonnet-5` |\n\nTourAPI 키와 Anthropic 키는 서버 API 라우트(`src/app/api/**`)에서만 읽으며 클라이언트에 절대 노출되지 않습니다.\n\n## 데이터 출처\n\n- **한국관광공사 TourAPI — `KorPetTourService2`**: 지역/키워드/위치 기반 관광정보 목록, 반려동물 동반 상세 규정(`detailPetTour2`), 법정동/분류체계 코드 조회. 필드 정의는 공식 매뉴얼(`한국관광공사_개방데이터_활용매뉴얼(반려동물동반여행)_v4.1.docx`)의 실제 응답 예시를 기준으로 검증했습니다.\n- **Anthropic Claude API**: 룰 기반 파서로 명확히 판정할 수 없는 모호한 규정 문구를 해석합니다.\n- **카카오맵 JavaScript SDK**: 지도/마커 표시.\n\n실제 규정은 현장 상황에 따라 변동될 수 있으므로, 서비스 내 모든 판정 결과에는 \"정보 기준: 한국관광공사 TourAPI, 실제 규정은 변동될 수 있음\" 고지가 함께 표시됩니다.\n\n## 판정 엔진 구조\n\n`/api/verdict`는 2단계 하이브리드로 동작합니다.\n\n1. **룰 기반 파서** (`src/lib/verdict/ruleEngine.ts`) — 체중 제한, 소형/중형/대형견 분류, 마릿수 제한, 실내 불가/야외 전용, 케이지·입마개·목줄 요구 등을 정규식으로 추출해 즉시 판정합니다. 무료이고 응답이 빠릅니다.\n2. **LLM 해석** (`src/lib/verdict/llm.ts`) — 룰로 확정할 수 없는 모호한 문구만 Claude API로 해석합니다. 응답은 zod 스키마로 검증하고, 신뢰도(`confidence`)가 0.6 미만이면 `UNKNOWN`으로 처리합니다.\n\n장소(`contentId`) × 반려동물 프로필(종/체중/마릿수) 단위로 서버 메모리 LRU 캐시(TTL 24시간, `src/lib/verdict/cache.ts`)에 저장해 같은 조합의 반복 조회 비용을 줄입니다.\n\n목록 화면의 배지는 비용을 줄이기 위해 **룰 엔진만** 사용해 즉시 계산하고(LLM 호출 없음), 상세 페이지에서만 하이브리드 엔진 전체(룰 → LLM)를 사용합니다.\n\n## 알려진 제한사항\n\n- 이 저장소에는 실제 TourAPI/Anthropic/카카오맵 키가 포함되어 있지 않습니다. 키 없이 실행하면 외부 API 호출은 실패하지만, 각 화면은 에러 배너(\"다시 시도\" 버튼 포함)와 대안 지역 제안으로 정상적으로 폴백합니다.\n- `contentTypeId` 값은 `KorPetTourService2` 매뉴얼 응답 예시(실제 표본 데이터)를 기준으로 매핑했습니다. 매뉴얼 설명 텍스트에 표기된 값(75~85)과 실제 표본 데이터의 값(12/14/32/39 등)이 서로 달라, 실제 표본 데이터를 우선했습니다.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMBAgf/xABPEAABAwMCAgUIBgUKBAQHAAAAAQIDBAURBhIhMRNBVGHRBxQWIlFxgaIXMjORkrEVI0JSoTQ1NjdTcnN0ssEkJZPhRGOC8GJkdYOElLP/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQMCBAX/xAAkEQEAAQUAAgIDAQEBAAAAAAAAAwECERNRFFIEQRIhMTIjsf/aAAwDAQACEQMRAD8A/ZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8cqNTKgeg4LMvUiIedM/uAkAj9M/uHTP7gJAI/TP7h0z+4CQCP0z+4dM/uAkAj9M/uHTP7gJAI/TP7j1Jl60RQO4PGqjkyh6AAAAAAAAAAAAptU31unbOte+ndUIkjWbGu28+vJcmK8q/8AQt3+Yj/3A2UT+khZJjG5qLj3n2Yv9M6nraRk+nrVTOoWsRI5KqRUfPhObW5TCezPMstLaidqG0VEjYEp6+mcsUsLlyjX44d+P+4GiBndFagm1DaZpquKOGqgndFLHHnCY5cyr0vrSe9aoqbdNTxR02JHU0jc5kRrsccrjl7BgbYGbqL/AFPp5TWGliidD5us1RI7O5nPCJxx7PvK+TUt7u1yq6XS9up5IKR6xyVVW9Wtc5OaNRBgbQGW0/qSuqL5NY79RR0lxjj6VixO3Mlb7U/9+081DqqSy6 크\n- [pandas](https://pandas.pydata.org/) — 데이터 처리\n- [Altair](https://altair-viz.github.io/) — 데이터 시각화\n\n## 데이터\n\n- `서울특별시 종로구_전자도서관소장목록_20250701.csv` (프로젝트 루트, cp949 인코딩)\n- `data_unused/` 폴더의 타 자치구 비교용 CSV 4종 (동대문구, 동작구, 서초구, 영등포구)\n\n## 실행 방법\n\n```bash\npip install -r requirements.txt\nstreamlit run app.py\n```\n\n브라우저에서 자동으로 열리는 로컬 주소(기본 `http://localhost:8501`)에서 대시보드를 확인할 수 있습니다.\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABQEAABAwMCAgUIBgYHBQYHAAABAAIDBAURBhIhMRNBUWHRBxQXIlRxgaIyM5GSobEVFiNCUlMkNDVicnPBNnSy4fAlN2OTlLNDVWR1goPC/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAEDAgQF/8QAIhEBAAEFAAIDAQEBAAAAAAAAAAMBAhETUQRBEhQxITIj/9oADAMBAAIRAxEAPwD9mREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBEXxxDRkoPqLgZj1ABfOmf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5Omf3IJCKP0z+5fRMesAoO6L40hwyF9QEREBERAREQEREBU2qb63TtnNe+ndUASNZsa7bz68q5WK8q/+xbv94j/ANUGyif0kLJMY3NBx717WL/TOp62kZPp61UzqFrAI5KqQh8+Bza3IwOzPNWWltRO1DaKiRsAp6+mcYpYXHIa/HDvx/zQaJFndFagm1DaZpquKOGqgndFLHHnAxy5qr0vrSe9aoqbdNTxR02JHU0jc5kDXY45OOXYmBtkWbqL/U/r5TWGliidD5uZqiR2dzOeAOOOz7VXyalvd2uVXS6Xt1PJBSPMclVVvLWucOYaAmBtEWW0/qSuqL5NY79RR0lxjj6VhiduZK3tH/XavmodVSWXVFDb3U7Zaeogc/1QTI5/ENa3q4kAfFMDVIsLX6m1NZXR116tFKy1veGv6CUukiB5ZPI/YpVTfNR3Br6nTNtpZre0kMmqJCHT45lo4cM9vNXA2CKh0jqFuorU6d0Jp6mGQxTxZztcOzuVXV6oulxvFTbdK0ENT5ods9VUPIja7sGOag2So9Q6gZZKm2wupnTefziEEP27OXHv5qqt+qLlSXyC06poYqWWq/q9RA7Mbz2ceR/5KN5Rv7T0x/8AcB+bVcI3SLNap1P+iZIbfboBW3 요합니다.\n\n## 기술 스택\n\n- React 19 + Vite, react-router-dom\n- Supabase(`@supabase/supabase-js`) — Auth, Postgres\n- Oxlint\n\n## 데이터베이스\n\nSupabase에 아래 두 테이블이 필요합니다(코드에서 실제 참조하는 테이블명은 `profiles-1`, `attendance-1`).\n\n| 테이블 | 주요 컬럼 | 설명 |\n|---|---|---|\n| `profiles-1` | `id`(uuid, PK, auth 사용자와 매핑), `name`, `role`(`admin` \\| `member`) | 계정 프로필 |\n| `attendance-1` | `id`, `member_id`(FK), `attendance_date`(date, KST 기준), `checked_at`(timestamptz) | 출석 기록. `UNIQUE(member_id, attendance_date)` |\n\n회원은 본인 행만, 관리자는 전체 행을 조회할 수 있도록 RLS 정책을 함께 구성해야 합니다.\n\n## 시작하기\n\n### 1. 의존성 설치\n\n```bash\nnpm install\n```\n\n### 2. 환경변수 설정\n\n`.env.example`을 복사해 `.env`를 만들고 값을 채웁니다.\n\n```bash\ncp .env.example .env\n```\n\n| 변수 | 설명 |\n|---|---|\n| `VITE_SUPABASE_URL` | Supabase 프로젝트 URL |\n| `VITE_SUPABASE_ANON_KEY` | Supabase anon(public) key |\n\nSupabase URL/anon key는 RLS로 보호되므로 클라이언트 코드에 포함해도 되지만, service_role 키나 Gmail 계정 정보는 절대 프런트엔드에 넣지 않습니다.\n\n### 3. 개발 서버 실행\n\n```bash\nnpm run dev\n```\n\n### 기타 명령어\n\n```bash\nnpm run build     # 프로덕션 빌드\nnpm run preview   # 빌드 결과 미리보기\nnpm run lint      # Oxlint 검사\n```\n\n## 프로젝트 구조\n\n```\nsrc/\n  pages/\n    Login.jsx        # 로그인 및 역할 기반 라우팅 분기\n    Attendance.jsx    # 회원용 출석체크 화면\n    Admin.jsx         # 관리자용 출결 현황 화면\n  lib/\n    supabaseClient.js  # Supabase 클라이언트 초기화\n    kstDate.js         # KST 날짜 계산, 연속 출석일수 계산\n  App.jsx              # 라우트 정의\nPRD.md                  # 화면/DB/이메일 알림 상세 명세\nCLAUDE.md               # 저장소 작업 규칙\n```\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMBAgf/xABPEAABAwMCAgQKBwQIBAMJAAAAAQIDBAURBhIhMRNBUWEHFBUiUnGBkaHRFhcyM1SSsTVTc8EjNDY3QnJ0siRVlOElY/BDYmR1goOis/H/xAAaAQEBAAMBAQAAAAAAAAAAAAAAAQIDBAYF/8QAJBEBAAIABwEAAwEBAQAAAAAAAAECAwQREhRRUhMhMUEysS ps://github.com/hwamokworks-ui/selfcare", "readme": "# 오늘의 건강 (Today's Health)\n\n식단·수분·걸음·수면·컨디션·체중·생리 주기를 하루 단위로 간편하게 기록하고, 요가·명상 영상으로 마음을 돌보는 셀프 웰니스 트래커입니다. 모든 기록은 브라우저 `localStorage`에 저장되며 별도의 백엔드/DB 없이 동작합니다.\n\n## 주요 기능\n\n- **오늘 탭** — 수분(잔 단위), 걸음 수, 수면 시간/만족도, 식단(끼니별 이름·칼로리·탄단지), 체중, 오늘의 컨디션(5단계 이모지), 생리 여부·양·동반 증상을 카드형 UI로 기록. 4대 지표(수분/걸음/수면/식단) 목표 대비 평균 달성률을 원형 그래프로 표시\n- **추세 탭** — `recharts` 라인 차트로 걸음 수·수분·수면·칼로리·체중·컨디션의 최근 14일 추이와 목표선(ReferenceLine)을 시각화, 평균/최고/최저값과 목표 달성률, 최근 7일 기록 피드 제공\n- **달력 탭** — 월별 캘린더에서 생리 주기를 예측(과거 기록의 평균 주기/기간을 바탕으로 다음 예상일 계산)하고 날짜별 기록을 조회\n- **영상 탭** — 유튜브 링크(또는 11자리 비디오 ID)를 요가/명상/스트레칭/호흡 카테고리로 등록해 나만의 마음챙김 영상 보관함을 구성, 몰입형 전체화면 플레이어 제공\n- 최초 실행 시 목표 설정값과 14일치 샘플 기록이 자동으로 시드되어 빈 화면 없이 바로 체험 가능\n\n## 기술 스택\n\n- **프런트엔드**: React 19 + TypeScript, Vite, Tailwind CSS (`@tailwindcss/vite`)\n- **UI/애니메이션**: `motion`(framer-motion 계열), `lucide-react` 아이콘\n- **차트**: `recharts`\n- **데이터 저장**: 브라우저 `localStorage` (서버/DB 미사용)\n- Google AI Studio 스캐폴드 특성상 `@google/genai`, `express`가 의존성에 포함되어 있으나, 현재 코드베이스에는 Gemini API를 실제로 호출하는 로직이 구현되어 있지 않습니다(추후 AI 기반 기능 확장을 위한 자리로 보입니다).\n\n## 설치 및 실행\n\n**요구 사항**: Node.js\n\n```bash\nnpm install\nnpm run dev\n```\n\n`npm run dev`는 `http://localhost:3000`에서 앱을 실행합니다. AI Studio 배포/향후 Gemini 연동을 위해 `.env.local`에 `GEMINI_API_KEY`를 설정하는 항목이 스캐폴드에 포함되어 있으나, 현재 버전 실행에는 필수가 아닙니다.\n\n```bash\nnpm run build     # 프로덕션 빌드 (dist/)\nnpm run preview   # 빌드 결과 미리보기\nnpm run lint      # tsc --noEmit 타입 체크\n```\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAwQHAQII/8QAUhAAAgIBAgMDCQMIBwUFBgcAAAECAwQFEQYSIRMxQQcUFiJRVGGi0XGBsRUyM0JzkZKhIzU2UlOywSQ0N3J0F5PC4fAlJmJjg7NDVXWCw9Lx/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAJBEBAAEDBAIDAQEBAAAAAAAAAAMBAhETFFFSBEESITEyI2H/2g pt", "Vite", "Gemini API", "Supabase"], "pushed": "2026-07-16", "live": "https://selfcare-v4.vercel.app", "github": "https://github.com/hwamokworks-ui/selfcare_v4", "readme": "# 오늘의 건강\n\n식단, 수분, 걸음, 수면, 체중, 컨디션, 생리 주기를 하루 단위로 간편하게 기록하고, 추세 분석과 요가·명상 영상으로 마음까지 돌보는 셀프 웰니스 트래커입니다. Supabase 이메일 로그인으로 사용자별 데이터를 클라우드에 저장하는, `selfcare` 프로젝트의 후속(v4) 버전입니다.\n\n## 주요 기능\n\n- **오늘 탭** — 수분(잔 단위), 걸음 수, 수면 시간/만족도, 식단(끼니별 칼로리·탄수화물·단백질·지방), 체중, 오늘의 컨디션(5단계), 생리 기록을 카드형 UI로 기록. 목표 대비 달성률을 원형 게이지와 진행 바로 표시\n- **마음 기록** — 오늘의 일기 / 잘한 일 / 잘못한 일을 자유 텍스트로 남기는 간단한 저널링\n- **추세 탭** — Recharts 기반 레이더 차트(오늘의 건강 밸런스)와 최근 14일 항목별(걸음/수분/수면/칼로리/체중/컨디션) 라인 차트, 평균·최고·최저 통계, 목표 달성률, 최근 7일 기록 피드\n- **달력 탭** — 월간 달력에서 날짜별 기록을 점(dot)으로 표시하고, 날짜를 눌러 상세 조회·수정 가능. 과거 생리 기록을 분석해 평균 주기·다음 예상 생리일을 자동 예측(D-Day 표시)\n- **영상 탭** — 요가/명상/스트레칭/호흡 카테고리별 유튜브 영상 라이브러리. 링크나 11자리 영상 ID를 붙여넣으면 자동으로 썸네일 미리보기 후 추가, 몰입형 전체화면 플레이어 제공\n- **계정** — Supabase Auth(이메일/비밀번호) 회원가입·로그인. 로그인하지 않으면 앱을 사용할 수 없으며, 모든 데이터는 로그인한 사용자별로 저장됨\n\n## 기술 스택\n\n- **프런트엔드**: React 19 + Vite 6 + TypeScript, Tailwind CSS 4\n- **UI/애니메이션**: `motion`(framer-motion 계열) 탭 전환/모달 애니메이션, `lucide-react` 아이콘\n- **차트**: `recharts` (레이더 차트, 라인 차트)\n- **백엔드/데이터**: Supabase (Auth + Postgres, Row Level Security로 사용자별 데이터 격리)\n- **참고**: `@google/genai`, `express` 등이 의존성에 포함되어 있으나 현재 소스 코드에서는 실제로 사용되지 않는 Google AI Studio 스캐폴딩 잔여물입니다.\n\n## 환경 변수 설정\n\n`.env.example`을 참고해 `.env.local` 파일을 만들고 Supabase 프로젝트 값을 채워주세요.\n\n```\nVITE_SUPABASE_URL=your-supabase-project-url\nVITE_SUPABASE_ANON_KEY=your-supabase-anon-key\n```\n\n값이 비어 있으면 로그인 화면 대신 \"Supabase 설정이 필요합니다\" 안내 화면이 표시됩니다.\n\n## Supabase 테이블 설정\n\n`supabase/schema.sql`을 Supabase 대시보드 SQL Editor에서 한 번 실행해 아래 테이블을 생성해야 합니다 (모두 RLS 적용, `auth.uid() = user_id` 정책으로 본인 데이터만 접근 가능).\n\n- `user_goals` — 사용자별 수분/걸음/수면/칼로리 목표\n- `videos` — 사용자별 요가·명상 영상 라이브러리\n- `daily_records` — 날짜별 식단/수분/걸음/수면/체중/컨디션/생리/마음 기록 (jsonb 컬럼 포함)\n\n## 실행 방법\n\n**사전 준비**: Node.js\n\n```bash\nnpm install\nnpm run dev\n```\n\n개발 서버는 `http://localhost:3000`에서 실행됩니다.\n\n## 프로젝트 구조\n\n```\nsrc/\n├── App.tsx                  # 하단 탭 네비게이션 및 전체 레이아웃\n├── components/\n│   ├── AuthGate.tsx          # Supabase 로그인/회원가입 및 세션 관리\n│   ├── TodayTab.tsx          # 오늘의 기록 입력 카드 + 마음 기록\n│   ├── TrendTab.tsx          # 레이더/라인 차트, 통계, 최근 기록 피드\n│   ├── CalendarTab.tsx       # 월간 달력, 생리 주기 예측, 날짜별 상세/수정\n│   └── VideoTab.tsx          # 유튜브 영상 라이브러리\n├── lib/\n│   ├── api.ts                 # Supabase CRUD (목표/영상/일별 기록)\n│   └── supabaseClient.ts      # Supabase 클라이언트 초기화\n├── utils/\n│   ├── period.ts              # 날짜 유틸 및 생리 주기 예측 로직\n│   └── seedData.ts            # 기본 목표치 및 샘플 영상 시드 데이터\n└── types.ts                  # DailyRecord, Video, UserGoals 등 타입 정의\nsupabase/schema.sql          # Supabase 테이블/RLS 정책 정의\n```\n", "cover": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAFAAoADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMCAQf/xABQEAABAwMBBAYGBwQHBQUJAAAAAQIDBAUREgYTITEWQVFUYdEHFCJxgaIVMjORkqGxIzVSUyQ0QnJzweE2YnSCsiVjk9LwN1VWZHWDlMLx/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAEDAgQF/8QAIxEBAAIBBQEAAwEBAQAAAAAAAAEDAhETFFFSBBIxQSEyI//aAAwDAQACEQMRAD8A/ZgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA+OVGplQPoOCzL1IiHzfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4DfP8AJAI++f4H1Jl60RQO4PjVRyZQ+gAAAAAAAAAAAKbam+t2ds6176d1QiSNZoa7Tz68lyYr0r/7Fu/4iP/MDZRP3kLJMY1NRce89mL+mdp62kZPs9aqZ1C1iJHJVSKj58Jza3KYTszzLLZbaJ20NoqJGwJT19M5YpYXLlGvxw8cf6gaIGd2K2gm2htM01XFHDVQTuiljjzhMcuZV7L7aT3raipt01PFHTYkdTSNzmRGuxxyuOXYNBtgZuov9T08prDSxROh9XWaokdnUznhE447PvK+TaW93a5VdLsvbqeSCkesclVVvVrXOTmjUQaDaAy2z+0ldUXyax36 <script>
(function(){
  var DATA = JSON.parse(document.getElementById('repo-data').textContent);
  var REPOS = DATA.repos, UNDEPLOYED = DATA.undeployed, STATS = DATA.stats;
  var activeTag = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- tiny markdown renderer ----------
  function inline(s){
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, '[이미지: $1]');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    return s;
  }

  function renderMarkdown(md){
    if(!md){ return '<p class="readme-empty">이 저장소에는 README.md가 없습니다.</p>'; }
    var lines = md.replace(/\r\n/g,'\n').split('\n');
    var html = [];
    var i = 0;
    var listBuf = null; // {type:'ul'|'ol', items:[]}
    function flushList(){
      if(listBuf){
        html.push('<'+listBuf.type+'>'+listBuf.items.map(function(it){return '<li>'+inline(it)+'</li>';}).join('')+'</'+listBuf.type+'>');
        listBuf = null;
      }
    }
    while(i < lines.length){
      var line = lines[i];

      if(/^```/.test(line)){
        flushList();
        var codeLines = [];
        i++;
        while(i < lines.length && !/^```/.test(lines[i])){ codeLines.push(lines[i]); i++; }
        i++;
        html.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');
        continue;
      }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if(h){
        flushList();
        var lvl = h[1].length;
        html.push('<h'+lvl+'>'+inline(h[2])+'</h'+lvl+'>');
        i++; continue;
      }

      if(/^\|.*\|\s*$/.test(line) && lines[i+1] && /^\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
        flushList();
        var headerCells = line.split('|').slice(1,-1).map(function(c){return c.trim();});
        i += 2;
        var rows = [];
        while(i < lines.length && /^\|.*\|\s*$/.test(lines[i])){
          rows.push(lines[i].split('|').slice(1,-1).map(function(c){return c.trim();}));
          i++;
        }
        var t = '<table><thead><tr>'+headerCells.map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
        rows.forEach(function(r){ t += '<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>'; });
        t += '</tbody></table>';
        html.push(t);
        continue;
      }

      var ol = line.match(/^\s*\d+\.\s+(.*)$/);
      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      if(ol){
        if(!listBuf || listBuf.type!=='ol'){ flushList(); listBuf = {type:'ol', items:[]}; }
        listBuf.items.push(ol[1]);
        i++; continue;
      }
      if(ul){
        if(!listBuf || listBuf.type!=='ul'){ flushList(); listBuf = {type:'ul', items:[]}; }
        listBuf.items.push(ul[1]);
        i++; continue;
      }
      flushList();

      if(/^\s*$/.test(line)){ i++; continue; }
      if(/^(---|\*\*\*)\s*$/.test(line)){ i++; continue; }

      // paragraph: gather until blank line / block start
      var para = [line];
      i++;
      while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      html.push('<p>'+inline(para.join(' '))+'</p>');
    }
    flushList();
    return html.join('\n');
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- cover toggle ----------
  var portfolioPanel = document.getElementById('panel-portfolio');
  document.getElementById('cover-toggle').addEventListener('change', function(e){
    portfolioPanel.classList.toggle('cover-on', e.target.checked);
  });

  // ---------- tag chip frequency (live repos only) ----------
  var tagFreq = {};
  REPOS.forEach(function(r){ r.tags.forEach(function(t){ tagFreq[t] = (tagFreq[t]||0)+1; }); });
  var tagList = Object.keys(tagFreq).sort(function(a,b){ return tagFreq[b]-tagFreq[a]; });

  function renderChips(){
    var row = document.getElementById('chip-row');
    row.innerHTML = '';
    var allChip = document.createElement('button');
    allChip.className = 'chip' + (activeTag===null?' active':'');
    allChip.innerHTML = '전체<span class="n">'+REPOS.length+'</span>';
    allChip.addEventListener('click', function(){ activeTag=null; renderChips(); renderCards(); });
    row.appendChild(allChip);
    tagList.forEach(function(t){
      var chip = document.createElement('button');
      chip.className = 'chip' + (activeTag===t?' active':'');
      chip.innerHTML = esc(t)+'<span class="n">'+tagFreq[t]+'</span>';
      chip.addEventListener('click', function(){ activeTag = (activeTag===t? null : t); renderChips(); renderCards(); });
      row.appendChild(chip);
    });
  }

  // ---------- cards ----------
  function renderCards(){
    var grid = document.getElementById('card-grid');
    grid.innerHTML = '';
    var list = activeTag ? REPOS.filter(function(r){ return r.tags.indexOf(activeTag) !== -1; }) : REPOS;
    list.forEach(function(r){
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="cover-wrap"><img src="'+r.cover+'" alt=""></div>'+
        '<div class="body">'+
          '<div class="head-row"><span class="name">'+esc(r.name)+'</span><span class="badge live">LIVE</span></div>'+
          (r.desc ? '<p class="desc">'+esc(r.desc)+'</p>' : '')+
          '<div class="tag-row">'+r.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>'+
          '<div class="pushed">pushed '+esc(r.pushed)+'</div>'+
        '</div>'+
        '<div class="foot">'+
          '<a href="'+r.live+'" target="_blank" rel="noopener" data-stop="1">Live <span class="icon-ext"></span></a>'+
          '<a href="'+r.github+'" target="_blank" rel="noopener" data-stop="1">Code <span class="icon-ext"></span></a>'+
        '</div>';
      card.querySelectorAll('a[data-stop]').forEach(function(a){ a.addEventListener('click', function(e){ e.stopPropagation(); }); });
      card.addEventListener('click', function(){ openModal(r); });
      grid.appendChild(card);
    });
  }

  // ---------- modal ----------
  var overlay = document.getElementById('modal-overlay');
  function openModal(r){
    document.getElementById('modal-content').innerHTML =
      '<div class="cover-wrap"><img src="'+r.cover+'" alt=""></div>'+
      '<div class="modal-body">'+
        '<div class="head-row"><span class="name">'+esc(r.name)+'</span><span class="badge live">LIVE</span></div>'+
        (r.desc ? '<p class="desc">'+esc(r.desc)+'</p>' : '')+
        '<div class="tag-row">'+r.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>'+
        '<div class="link-row">'+
          '<a class="primary" href="'+r.live+'" target="_blank" rel="noopener">Live <span class="icon-ext" style="filter:invert(1)"></span></a>'+
          '<a class="secondary" href="'+r.github+'" target="_blank" rel="noopener">GitHub <span class="icon-ext"></span></a>'+
        '</div>'+
        '<div class="readme">'+renderMarkdown(r.readme)+'</div>'+
      '</div>';
    overlay.classList.add('open');
  }
  document.getElementById('modal-close').addEventListener('click', function(){ overlay.classList.remove('open'); });
  overlay.addEventListener('click', function(e){ if(e.target === overlay){ overlay.classList.remove('open'); } });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ overlay.classList.remove('open'); } });

  // ---------- stats ----------
  function renderStats(){
    var bars = document.getElementById('tag-bars');
    var counts = STATS.allTagCounts;
    var keys = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
    var max = keys.reduce(function(m,k){ return Math.max(m, counts[k]); }, 1);
    bars.innerHTML = keys.map(function(k){
      var pct = Math.round(counts[k]/max*100);
      return '<div class="bar-row"><span class="label">'+esc(k)+'</span>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
        '<span class="count">'+counts[k]+'</span></div>';
    }).join('');

    var total = STATS.active + STATS.dormant;
    var activePct = total ? Math.round(STATS.active/total*100) : 0;
    var dormantPct = 100 - activePct;
    var abar = document.getElementById('activity-bar');
    abar.innerHTML =
      (STATS.active>0 ? '<div class="seg-active" style="width:'+activePct+'%"></div>' : '') +
      (STATS.dormant>0 ? '<div class="seg-dormant" style="width:'+dormantPct+'%"></div>' : '');
    document.getElementById('activity-legend').innerHTML =
      '<div class="legend-item"><span class="legend-dot" style="background:var(--live)"></span>활발함 '+STATS.active+'개</div>'+
      '<div class="legend-item"><span class="legend-dot" style="background:var(--ink-faint)"></span>방치됨 '+STATS.dormant+'개</div>';
  }

  renderChips();
  renderCards();
  renderStats();
})();
</script>

</body>
</html>
